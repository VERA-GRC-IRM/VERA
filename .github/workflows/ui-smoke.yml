name: UI smoke and accessibility

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/e2e/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/playwright.config.js"
      - ".github/workflows/ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-ui-smoke:
    name: Chromium UI and accessibility smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run focused UI and accessibility checks
        id: ui-checks
        run: |
          started=$SECONDS
          npx playwright test e2e/dashboard-ui-smoke.spec.js --project=chromium
          elapsed=$((SECONDS - started))
          echo "elapsed_seconds=$elapsed" >> "$GITHUB_OUTPUT"
          {
            echo "## UI smoke and accessibility"
            echo "- Scope: portfolio dashboard keyboard navigation and automated WCAG 2.1 A/AA scan."
            echo "- Browser: Chromium on Ubuntu 24.04."
            echo "- Duration: ${elapsed}s."
            echo "- Data: local synthetic session and intercepted API responses; no production services or records."
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: frontend
        env:
          CI: "true"

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vera-ui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
