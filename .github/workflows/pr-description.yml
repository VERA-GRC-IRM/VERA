name: PR documentation

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, assigned, unassigned]

permissions:
  contents: read
  pull-requests: read

jobs:
  description:
    name: Reviewable PR description
    # An edited description on an already merged PR must not create a new check.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The event base SHA can predate this script when an old PR is edited.
          # The default branch is trusted; never check out the PR head here.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check scope, evidence, verification and risks
        run: python3 .github/scripts/check_pr_description.py
