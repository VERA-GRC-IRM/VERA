name: Portal público de calidad

on:
  workflow_run:
    workflows:
      - Software quality
      - Browser and accessibility tests
      - CodeQL
      - VERA — Informe integral de calidad (navegadores diferidos)
      - AI continuous evaluation
      - VERA · Demostración Excel, Power BI y Teams
      - Preview role acceptance
      - Production smoke
      - Local Supabase migration and restore rehearsal
      - Offline mode rehearsal
      - Offline browser matrix
      - Offline upgrade across releases
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vera-quality-portal
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    name: Publicar plataforma de calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Verify current and historical integration states
        run: python3 -m unittest discover -s scripts/tests -p 'test_quality_portal_integrations.py'

      - name: Generate read-only quality portal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-quality-portal.py --output-dir "$RUNNER_TEMP/vera-quality-portal"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static portal
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vera-quality-portal

      - name: Wait until Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..15}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name' | grep -Fxq "$PAGES_ARTIFACT_NAME"; then
              exit 0
            fi
            sleep 2
          done
          echo "Pages artifact was not visible in the Actions API after 30 seconds" >&2
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
