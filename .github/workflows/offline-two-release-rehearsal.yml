name: Offline upgrade across releases

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: "Full commit SHA of a previously working application release"
        required: true
        default: "dd5803dac2f63013ce8d3c37edc967008eabb6c0"

permissions:
  contents: read

concurrency:
  group: offline-two-releases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Two application bundles and encrypted draft (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate baseline SHA
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Use a full lowercase commit SHA."; exit 1; }

      - name: Checkout target release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout baseline release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_sha }}
          path: baseline
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            baseline/frontend/package-lock.json

      - name: Install and build baseline
        run: npm ci && npm run build
        working-directory: baseline/frontend

      - name: Install and build target
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Rehearse upgrade
        run: npx playwright test --config playwright.offline-upgrade.config.js
        working-directory: frontend
        env:
          CI: "true"
          VERA_OFFLINE_BASELINE_DIST: ${{ github.workspace }}/baseline/frontend/dist

      - name: Record scope
        if: always()
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          echo "## Offline upgrade across two builds" >> "$GITHUB_STEP_SUMMARY"
          printf 'Baseline: %s\nTarget: %s\n' "$BASELINE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "This uses two built application releases, a synthetic account and API, and Chromium. It does not prove production deployment, physical-device behavior or continued access after revocation." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vera-offline-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
