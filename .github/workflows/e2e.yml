name: Browser and accessibility tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, label: desktop-chromium }
          - { project: firefox, browser: firefox, label: desktop-firefox }
          - { project: mobile-chrome, browser: chromium, label: mobile-chromium }
          - { project: tablet-chromium, browser: chromium, label: tablet-chromium }
          - { project: "Google Chrome", browser: chrome, label: google-chrome }
          - { project: "Microsoft Edge", browser: msedge, label: microsoft-edge }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install browser binaries
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npx playwright install ffmpeg
          if [ "$BROWSER" = "chrome" ] && command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif [ "$BROWSER" = "msedge" ] && command -v microsoft-edge >/dev/null 2>&1; then
            microsoft-edge --version
          else
            npx playwright install "$BROWSER"
          fi
        working-directory: frontend

      - name: Run browser, viewport and accessibility tests
        run: npm run test:e2e -- --project="${{ matrix.project }}"
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BRANDED_BROWSERS: "1"

      - name: Upload browser traces and HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vera-e2e-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  e2e-result:
    name: UI E2E (Chrome, Edge, Firefox, mobile/tablet)
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every browser and viewport to pass
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "One or more browser projects did not pass. Review the six Browser E2E jobs and their separate artifacts."
            exit 1
          fi
          echo "All six browser and viewport projects passed."
